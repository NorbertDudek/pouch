name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  extension:
    name: Firefox add-on
    runs-on: ubuntu-latest
    if: ${{ hashFiles('extension/manifest.json') != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: web-ext lint
        run: npx --yes web-ext lint --source-dir extension --self-hosted

  server:
    name: Sync server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          extensions: pdo_sqlite
      - name: PHP syntax check
        run: |
          files=$(find server -name '*.php' 2>/dev/null)
          if [ -z "$files" ]; then echo "No PHP files"; exit 0; fi
          for f in $files; do php -l "$f"; done

  android:
    name: Android app
    runs-on: ubuntu-latest
    if: ${{ hashFiles('android/gradlew') != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
