name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  extension:
    name: Firefox add-on
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install web-ext
        run: npm ci
      - name: web-ext lint
        run: npm run lint

  server:
    name: Sync server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          extensions: pdo_sqlite
      - name: PHP syntax check
        run: find server -name '*.php' -print0 | xargs -0 -n1 php -l

# The Android app (android/) is built with Delphi / RAD Studio (FireMonkey),
# which is not available on GitHub-hosted runners - build it locally.
